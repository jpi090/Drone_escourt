<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Escorts</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --bg:#070b16; --bg2:#0b1222; --panel:rgba(18,27,48,.72); --panel-solid:#121b30;
  --line:rgba(120,160,255,.16); --txt:#e8eefc; --dim:#8fa3c8; --dimmer:#5f739a;
  --accent:#2ad4ff; --accent2:#6b8cff;
  --green:#26d07c; --yellow:#f5c84b; --orange:#ff9340; --red:#ff4d5e;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(1200px 700px at 15% -10%,#13224a 0%,transparent 60%),
             radial-gradient(900px 600px at 100% 0%,#0d2b3d 0%,transparent 55%),var(--bg);
  color:var(--txt); font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}

/* ---------- chrome ---------- */
header{
  display:flex;align-items:center;gap:18px;padding:12px 18px;
  border-bottom:1px solid var(--line);background:rgba(7,11,22,.75);backdrop-filter:blur(14px);
  flex:0 0 auto;z-index:600;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.14em;font-size:13px}
.brand .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);
  box-shadow:0 0 0 4px rgba(42,212,255,.16),0 0 18px var(--accent)}
.sim{font-size:10px;letter-spacing:.1em;color:var(--yellow);border:1px solid rgba(245,200,75,.35);
  background:rgba(245,200,75,.08);padding:3px 8px;border-radius:5px;font-weight:650}
.roles{display:flex;gap:3px;background:rgba(255,255,255,.05);padding:3px;border-radius:9px;margin-left:auto}
.roles button{padding:7px 15px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--dim)}
.roles button[aria-pressed=true]{background:linear-gradient(180deg,#2b3f6d,#223257);color:#fff;
  box-shadow:0 1px 0 rgba(255,255,255,.1) inset}
.clock{font-family:var(--mono);font-size:12px;color:var(--dim);min-width:68px;text-align:right}

main{flex:1;display:grid;grid-template-columns:330px 1fr 330px;gap:12px;padding:12px;min-height:0}
main.operator{grid-template-columns:360px 1fr 330px}
.col{display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;scrollbar-width:thin}
.col::-webkit-scrollbar{width:7px}
.col::-webkit-scrollbar-thumb{background:rgba(120,160,255,.2);border-radius:4px}

.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:14px;
  backdrop-filter:blur(13px);flex:0 0 auto}
.card > h3{font-size:10.5px;letter-spacing:.13em;color:var(--dim);text-transform:uppercase;margin-bottom:11px}
.map-wrap{position:relative;border-radius:13px;overflow:hidden;border:1px solid var(--line);min-height:0}
#map{position:absolute;inset:0;background:#0a1020}
.leaflet-container{background:#0a1020}
.leaflet-tile{filter:invert(1) hue-rotate(185deg) brightness(.72) contrast(1.12) saturate(.6)}
.leaflet-control-attribution{background:rgba(7,11,22,.8)!important;color:#6b7fa6!important;font-size:9px!important}
.leaflet-control-attribution a{color:#8fa3c8!important}

/* ---------- bits ---------- */
.row{display:flex;align-items:center;gap:9px}
.kv{display:grid;grid-template-columns:1fr auto;gap:7px 10px;font-size:12.5px}
.kv dt{color:var(--dim)}
.kv dd{margin:0;font-family:var(--mono);font-weight:600}
label.fld{display:block;font-size:11px;color:var(--dim);margin:11px 0 5px;letter-spacing:.03em}
label.fld:first-of-type{margin-top:0}
select,input[type=text]{width:100%;background:rgba(10,16,32,.85);border:1px solid var(--line);
  color:var(--txt);border-radius:8px;padding:9px 10px;font:inherit;font-size:13px}
select:focus,input:focus{outline:2px solid rgba(42,212,255,.45);outline-offset:0;border-color:transparent}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.modes button{padding:9px 0;border-radius:8px;border:1px solid var(--line);font-size:11px;
  color:var(--dim);background:rgba(10,16,32,.6)}
.modes button[aria-pressed=true]{border-color:var(--accent);color:var(--accent);background:rgba(42,212,255,.1)}

.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;
  border-radius:10px;font-weight:650;font-size:13.5px;transition:filter .15s,transform .05s}
.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.38;cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(1.12)}
.btn-primary{background:linear-gradient(180deg,#2ad4ff,#1b9fd4);color:#04141d;
  box-shadow:0 5px 22px -8px rgba(42,212,255,.75)}
.btn-ghost{border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--txt)}
.btn-sos{background:linear-gradient(180deg,#ff5a68,#d32030);color:#fff;padding:17px;font-size:15px;
  letter-spacing:.1em;box-shadow:0 6px 26px -8px rgba(255,77,94,.8)}
.btn-sm{padding:7px 11px;border-radius:7px;font-size:11.5px;font-weight:600;border:1px solid var(--line);
  background:rgba(255,255,255,.05)}
.btn-sm:hover{background:rgba(255,255,255,.1)}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}

.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-size:11px;font-weight:650;letter-spacing:.04em}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-green{color:var(--green);background:rgba(38,208,124,.13)}
.p-yellow{color:var(--yellow);background:rgba(245,200,75,.13)}
.p-orange{color:var(--orange);background:rgba(255,147,64,.14)}
.p-red{color:var(--red);background:rgba(255,77,94,.15)}
.p-idle{color:var(--dim);background:rgba(143,163,200,.12)}

.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:6px}
.bar > i{display:block;height:100%;border-radius:3px;transition:width .4s,background .4s}

.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;text-align:center}
.stat{background:rgba(10,16,32,.6);border:1px solid var(--line);border-radius:9px;padding:9px 4px}
.stat b{display:block;font-family:var(--mono);font-size:16px;font-weight:650;letter-spacing:-.02em}
.stat span{font-size:9.5px;color:var(--dim);letter-spacing:.07em;text-transform:uppercase}

.feed{display:flex;flex-direction:column;gap:7px;max-height:280px;overflow-y:auto;scrollbar-width:thin}
.feed::-webkit-scrollbar{width:6px}
.feed::-webkit-scrollbar-thumb{background:rgba(120,160,255,.2);border-radius:3px}
.item{border:1px solid var(--line);border-left-width:3px;border-radius:8px;padding:9px 10px;
  background:rgba(10,16,32,.55);font-size:12px;animation:slide .25s ease-out}
@keyframes slide{from{opacity:0;transform:translateX(7px)}}
.item b{display:block;font-size:12.5px;margin-bottom:2px;font-weight:620}
.item small{color:var(--dim);font-size:10.5px;font-family:var(--mono)}
.item p{margin:3px 0 0;color:var(--dim);font-size:11.5px;line-height:1.45}
.i-green{border-left-color:var(--green)} .i-yellow{border-left-color:var(--yellow)}
.i-orange{border-left-color:var(--orange)} .i-red{border-left-color:var(--red)}
.i-info{border-left-color:var(--accent2)}
.empty{color:var(--dimmer);font-size:12px;text-align:center;padding:16px 8px;font-style:italic}

.prov{font-size:10px;color:var(--dimmer);margin-top:6px;font-family:var(--mono);
  display:flex;gap:6px;flex-wrap:wrap}
.prov span{border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.unconf{border-style:dashed!important;color:var(--yellow)}

/* checklist */
.chk{display:flex;flex-direction:column;gap:6px;font-size:12px;font-family:var(--mono)}
.chk div{display:flex;align-items:center;gap:8px;color:var(--dim)}
.chk i{width:14px;text-align:center;font-style:normal}
.chk .ok i{color:var(--green)} .chk .ok{color:var(--txt)}
.chk .no i{color:var(--red)} .chk .no{color:var(--red)}
.chk .wait i{color:var(--dim)}

/* video */
.video{position:relative;aspect-ratio:16/10;border-radius:10px;overflow:hidden;
  background:#060a14;border:1px solid var(--line)}
.video canvas{width:100%;height:100%;display:block}
.video .hud{position:absolute;inset:0;pointer-events:none;font-family:var(--mono);font-size:9.5px;
  color:rgba(42,212,255,.95);padding:8px;display:flex;flex-direction:column;justify-content:space-between}
.video .hud .tr{align-self:flex-end}
.video .rec{color:var(--red);display:flex;align-items:center;gap:5px;font-weight:700}
.video .rec::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--red);
  animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.15}}
.video .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  color:var(--dimmer);font-size:12px;letter-spacing:.1em}

/* markers */
.mk{display:grid;place-items:center;font-size:15px}
.mk-drone{filter:drop-shadow(0 0 7px var(--accent))}
.mk-veh{filter:drop-shadow(0 0 6px var(--accent2))}
.ring{width:38px;height:38px;border-radius:50%;border:2px solid var(--red);
  animation:pulse 1.5s ease-out infinite}
@keyframes pulse{0%{transform:scale(.45);opacity:1}100%{transform:scale(1.5);opacity:0}}

/* sos overlay */
.ovl{position:fixed;inset:0;background:rgba(4,7,14,.86);backdrop-filter:blur(7px);z-index:1000;
  display:grid;place-items:center;padding:20px}
.ovl[hidden]{display:none}
.sheet{background:var(--panel-solid);border:1px solid rgba(255,77,94,.4);border-radius:16px;
  padding:26px;max-width:420px;width:100%;text-align:center;
  box-shadow:0 30px 80px -20px rgba(255,77,94,.4)}
.sheet h2{font-size:20px;margin-bottom:8px}
.sheet p{color:var(--dim);font-size:13px;line-height:1.6;margin:0 0 18px}
.count{font-family:var(--mono);font-size:54px;font-weight:700;color:var(--red);line-height:1;margin:14px 0}
.sos-live{position:fixed;inset:0;border:4px solid var(--red);pointer-events:none;z-index:900;
  animation:flash 1.3s ease-in-out infinite}
.sos-live[hidden]{display:none}
@keyframes flash{50%{border-color:rgba(255,77,94,.15)}}

/* operator */
.mission{border:1px solid var(--line);border-radius:10px;padding:11px;background:rgba(10,16,32,.6);
  cursor:pointer;transition:border-color .15s}
.mission:hover{border-color:rgba(42,212,255,.45)}
.mission.sel{border-color:var(--accent);background:rgba(42,212,255,.07)}
.mission.sos{border-color:var(--red);background:rgba(255,77,94,.08)}
.mission .top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.mission .nm{font-weight:650;font-size:13px}
.mission .meta{font-size:11px;color:var(--dim);font-family:var(--mono)}
.sla{font-family:var(--mono);font-size:11px;color:var(--red);font-weight:700}
.audit{font-family:var(--mono);font-size:10.5px;color:var(--dim);display:flex;flex-direction:column;
  gap:4px;max-height:200px;overflow-y:auto}
.audit b{color:var(--accent2);font-weight:600}

/* replay */
input[type=range]{width:100%;accent-color:var(--accent);margin-top:4px}
.note{font-size:11px;color:var(--dimmer);line-height:1.5;margin-top:9px}

@media (max-width:1100px){
  main,main.operator{grid-template-columns:1fr;grid-template-rows:auto 340px auto;overflow-y:auto}
  .col{overflow:visible}
}
</style>
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span>DRONE ESCORTS</div>
  <span class="sim">SIMULATED FLIGHT · REAL SOFTWARE</span>
  <div class="roles" role="group" aria-label="View">
    <button id="rSub" aria-pressed="true">Subscriber</button>
    <button id="rOps" aria-pressed="false">Command (SOC)</button>
  </div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<main id="main">
  <!-- ============ LEFT ============ -->
  <div class="col" id="colLeft"></div>

  <!-- ============ MAP ============ -->
  <div class="map-wrap"><div id="map"></div></div>

  <!-- ============ RIGHT ============ -->
  <div class="col" id="colRight"></div>
</main>

<div class="sos-live" id="sosFrame" hidden></div>

<div class="ovl" id="sosModal" hidden>
  <div class="sheet">
    <h2 id="sosTitle">Emergency SOS</h2>
    <p id="sosBody">Releasing this alert notifies the operations centre, your emergency contacts,
      and begins protected recording. Cancel within the window if this was accidental.</p>
    <div class="count" id="sosCount">5</div>
    <button class="btn btn-ghost" id="sosCancel">Cancel — I'm safe</button>
    <button class="btn btn-sos" id="sosNow" style="margin-top:8px">Send now</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============================================================================
   DRONE ESCORTS — Phase 1 prototype
   Simulated flight dynamics, real application logic: mission state machine,
   pre-flight gating, battery-reserve enforcement, advisory provenance,
   two-stage SOS, operator triage with SLA, append-only audit, mission replay.
   ========================================================================== */

/* ---------- fixed demo data ---------- */
const ROUTES = {
  'ajah': {
    label:'Ikoyi → Ajah (Lekki-Epe corridor)',
    corridor:'LOS-C4 · authorised VLOS corridor',
    pts:[[6.4478,3.4372],[6.4421,3.4512],[6.4380,3.4668],[6.4372,3.4840],
         [6.4398,3.5010],[6.4441,3.5168],[6.4489,3.5320],[6.4551,3.5462],
         [6.4618,3.5594],[6.4672,3.5722],[6.4698,3.5852]],
    advisories:[
      {at:.34,level:'yellow',cat:'Traffic',desc:'Standing traffic at toll approach, ~1.4 km queue.',
       source:'Road data feed',conf:'high',confirmed:true},
      {at:.63,level:'orange',cat:'Reported incident',
       desc:'Two stationary vehicles on the hard shoulder with occupants outside. Unverified.',
       source:'Operator report',conf:'medium',confirmed:false}
    ]
  },
  'apapa':{
    label:'Apapa Port → Ikeja (cargo corridor)',
    corridor:'LOS-C1 · authorised VLOS corridor',
    pts:[[6.4412,3.3598],[6.4520,3.3561],[6.4648,3.3520],[6.4790,3.3498],
         [6.4938,3.3471],[6.5080,3.3438],[6.5214,3.3402],[6.5352,3.3380],
         [6.5488,3.3398],[6.5608,3.3432],[6.5702,3.3480]],
    advisories:[
      {at:.22,level:'yellow',cat:'Congestion',desc:'Container queue narrowing carriageway to one lane.',
       source:'Road data feed',conf:'high',confirmed:true},
      {at:.55,level:'orange',cat:'Known ambush point',
       desc:'Historic cargo-loss location. Two prior reports this quarter.',
       source:'Incident history',conf:'medium',confirmed:true},
      {at:.80,level:'yellow',cat:'Crowd',desc:'Roadside market overflow; pedestrians in carriageway.',
       source:'Operator report',conf:'low',confirmed:false}
    ]
  },
  'school':{
    label:'Ikeja → Magodo (school run)',
    corridor:'LOS-C7 · authorised VLOS corridor',
    pts:[[6.5968,3.3372],[6.6020,3.3458],[6.6078,3.3552],[6.6132,3.3650],
         [6.6168,3.3752],[6.6190,3.3858],[6.6212,3.3962],[6.6248,3.4058],
         [6.6290,3.4140],[6.6332,3.4208],[6.6368,3.4262]],
    advisories:[
      {at:.48,level:'yellow',cat:'Weather',desc:'Heavy rain cell crossing route; reduced visibility.',
       source:'Weather service',conf:'high',confirmed:true}
    ]
  }
};
const MODES = {walk:{label:'Walk',kmh:5,standoff:60,alt:45},bike:{label:'Bicycle',kmh:17,standoff:90,alt:55},
  moto:{label:'Motorcycle',kmh:42,standoff:150,alt:70},car:{label:'Car',kmh:58,standoff:220,alt:90}};
const DRONES=[
  {id:'DE-114',model:'Sentinel X2',battery:97,cycles:184,fw:'4.2.1',dock:'Vehicle dock · LAG-4421',air:'ok'},
  {id:'DE-087',model:'Sentinel X2',battery:62,cycles:402,fw:'4.2.1',dock:'Hub · Lekki Phase 1',air:'ok'},
  {id:'DE-203',model:'Sentinel X1',battery:88,cycles:912,fw:'4.1.8',dock:'Hub · Ikeja',air:'maintenance'}
];
const RESERVE=22;           // % battery reserved for return — hard floor
const LOW_WARN=30;
const TICK=500;             // ms
const TIME_SCALE=8;         // 1 tick = 4 simulated seconds

/* ---------- state ---------- */
const S={
  role:'sub', routeKey:'ajah', mode:'car', droneId:'DE-114',
  mission:null, selMission:null, replay:null,
  notes:[], audit:[], sosTimer:null, sosCountdown:0, missions:[], seq:1
};

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const n=document.createElement(t);if(c)n.className=c;if(h!=null)n.innerHTML=h;return n};
const pad=n=>String(n).padStart(2,'0');
const hhmmss=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
const mmss=s=>`${pad(Math.floor(s/60))}:${pad(Math.floor(s%60))}`;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function haversine(a,b){
  const R=6371e3,p=Math.PI/180;
  const dla=(b[0]-a[0])*p,dlo=(b[1]-a[1])*p;
  const x=Math.sin(dla/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(dlo/2)**2;
  return 2*R*Math.asin(Math.sqrt(x));
}
/* densify anchor points into a smooth path, and build cumulative distance */
function buildPath(pts){
  const out=[];
  for(let i=0;i<pts.length-1;i++){
    const a=pts[i],b=pts[i+1];
    for(let k=0;k<24;k++){const t=k/24;out.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t]);}
  }
  out.push(pts[pts.length-1]);
  const cum=[0];
  for(let i=1;i<out.length;i++)cum.push(cum[i-1]+haversine(out[i-1],out[i]));
  return {path:out,cum,total:cum[cum.length-1]};
}
function atDistance(g,d){
  d=Math.max(0,Math.min(g.total,d));
  let i=1; while(i<g.cum.length-1&&g.cum[i]<d)i++;
  const seg=g.cum[i]-g.cum[i-1]||1, t=(d-g.cum[i-1])/seg;
  const a=g.path[i-1],b=g.path[i];
  return {ll:[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t],
          bearing:Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI};
}

/* ---------- logging ---------- */
function note(level,title,body){
  S.notes.unshift({level,title,body,ts:new Date()});
  if(S.notes.length>40)S.notes.pop();
  render();
}
function audit(actor,action,detail){
  S.audit.unshift({actor,action,detail,ts:new Date()});
  if(S.audit.length>60)S.audit.pop();
}

/* ============================ MAP ============================ */
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([6.456,3.51],12);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19,attribution:'© OpenStreetMap · simulated flight data'}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);

const layers={route:null,flown:null,veh:null,drone:null,leash:null,adv:[],sos:null,ghost:null};
const icon=(html,cls,size)=>L.divIcon({html,className:'mk '+cls,iconSize:[size,size],iconAnchor:[size/2,size/2]});

function clearLayer(k){if(layers[k]){map.removeLayer(layers[k]);layers[k]=null}}
function drawRoute(){
  clearLayer('route');clearLayer('flown');
  layers.adv.forEach(l=>map.removeLayer(l));layers.adv=[];
  const r=ROUTES[S.routeKey], g=buildPath(r.pts);
  layers.route=L.polyline(g.path,{color:'#6b8cff',weight:4,opacity:.55,dashArray:'1 9',
    lineCap:'round'}).addTo(map);
  layers.flown=L.polyline([],{color:'#2ad4ff',weight:4.5,opacity:.95}).addTo(map);
  r.advisories.forEach(a=>{
    const p=atDistance(g,g.total*a.at).ll;
    const col={yellow:'#f5c84b',orange:'#ff9340',red:'#ff4d5e'}[a.level];
    const c=L.circle(p,{radius:260,color:col,weight:1.5,fillColor:col,fillOpacity:.14,
      dashArray:a.confirmed?null:'4 5'}).addTo(map);
    c.bindPopup(`<b>${esc(a.cat)}</b><br>${esc(a.desc)}<br><small>${esc(a.source)} · ${a.confirmed?'confirmed':'UNCONFIRMED'}</small>`);
    layers.adv.push(c);
  });
  map.fitBounds(layers.route.getBounds(),{padding:[45,45]});
  return g;
}
drawRoute();

/* ============================ MISSION ============================ */
function selectedDrone(){return DRONES.find(d=>d.id===S.droneId)}

function preflight(){
  const d=selectedDrone(), r=ROUTES[S.routeKey];
  return [
    {k:'Entitlement — Fleet plan, 7 escorts remaining',ok:true},
    {k:`Airspace — ${r.corridor}`,ok:true},
    {k:`RPIC assigned — A. Bello, licence valid`,ok:true},
    {k:`Battery ${d.battery}% ≥ ${RESERVE+25}% required`,ok:d.battery>=RESERVE+25},
    {k:'GNSS fix — 18 satellites, RTK float',ok:true},
    {k:'IMU / compass health',ok:true},
    {k:'Camera and link check — 720p, −62 dBm',ok:true},
    {k:'Wind 14 km/h within limits',ok:true},
    {k:`Airworthiness — ${d.air==='ok'?'cleared':'MAINTENANCE DUE, grounded'}`,ok:d.air==='ok'}
  ];
}

function launch(){
  const checks=preflight(), failed=checks.filter(c=>!c.ok);
  if(failed.length){
    note('red','Launch refused',failed.map(f=>f.k).join(' · '));
    audit('system','launch.refused',failed.map(f=>f.k).join('; '));
    return;
  }
  const r=ROUTES[S.routeKey], g=buildPath(r.pts), m=MODES[S.mode], d=selectedDrone();
  S.mission={
    id:'MSN-'+String(1040+S.seq++), drone:d.id, rpic:'A. Bello',
    routeKey:S.routeKey, mode:S.mode, geo:g,
    state:'launching', t:0, dist:0, peak:0, battery:d.battery, alt:0, speed:0,
    standoff:m.standoff, targetAlt:m.alt,
    advisories:[], fired:new Set(), samples:[], sos:null, recording:false,
    startedAt:new Date(), endedAt:null, reserveTripped:false, paused:false
  };
  S.selMission=S.mission.id;
  clearLayer('veh');clearLayer('drone');clearLayer('leash');clearLayer('ghost');
  const p0=g.path[0];
  layers.veh=L.marker(p0,{icon:icon('▮','mk-veh',20)}).addTo(map);
  layers.drone=L.marker(p0,{icon:icon('✛','mk-drone',22)}).addTo(map);
  layers.leash=L.polyline([p0,p0],{color:'#2ad4ff',weight:1,opacity:.4,dashArray:'3 4'}).addTo(map);
  layers.flown.setLatLngs([]);
  note('info','Pre-flight complete',`${checks.length} checks passed. ${d.id} armed by RPIC A. Bello.`);
  audit('rpic:A. Bello','mission.authorised',`${S.mission.id} · ${d.id} · ${r.corridor}`);
  audit('system','mission.launch',S.mission.id);
  map.setView(p0,15,{animate:true});
}

function command(cmd){
  const M=S.mission; if(!M)return;
  if(cmd==='pause'){M.paused=true;M.state='paused';note('info','Mission paused','Drone holding position. Subject tracking continues.');audit('subscriber','mission.pause',M.id)}
  if(cmd==='resume'){M.paused=false;M.state='escorting';note('info','Mission resumed','Escort re-engaged.');audit('subscriber','mission.resume',M.id)}
  if(cmd==='rtd'){M.state='returning';note('info','Returning to dock','Drone is flying home. Journey continues unescorted.');audit('subscriber','mission.rtd',M.id)}
  if(cmd==='abort'){M.state='returning';M.abort='RPIC manual abort';note('red','RPIC took manual control','Flight terminated by remote pilot. Returning to dock.');audit('rpic:A. Bello','mission.abort',M.id)}
  render();
}

function endMission(outcome){
  const M=S.mission; if(!M)return;
  M.state=outcome; M.endedAt=new Date(); M.recording=false;
  S.missions.unshift(M);
  audit('system','mission.'+outcome,`${M.id} · ${(M.peak/1000).toFixed(2)} km · ${M.samples.length} telemetry samples`);
  note(outcome==='completed'?'green':'yellow',
    outcome==='completed'?'Mission complete':'Mission ended',
    `${M.id} · ${(M.peak/1000).toFixed(2)} km · ${mmss(M.t)} · record sealed with ${M.samples.length} samples.`);
  S.mission=null; clearLayer('leash');
  render();
}

/* ---------- SOS ---------- */
function sosArm(silent){
  if(S.sosCountdown>0)return;
  if(silent){sosFire(true);return}
  S.sosCountdown=5;
  $('#sosModal').hidden=false; $('#sosCount').textContent='5';
  S.sosTimer=setInterval(()=>{
    S.sosCountdown--; $('#sosCount').textContent=S.sosCountdown;
    if(S.sosCountdown<=0)sosFire(false);
  },1000);
}
function sosAbort(){
  clearInterval(S.sosTimer); S.sosCountdown=0; $('#sosModal').hidden=true;
  audit('subscriber','sos.cancelled','within confirmation window');
  note('info','SOS cancelled','No alert was sent.');
}
function sosFire(silent){
  clearInterval(S.sosTimer); S.sosCountdown=0; $('#sosModal').hidden=true;
  const M=S.mission;
  const sos={id:'SOS-'+String(410+S.seq++),at:new Date(),silent,ack:null,escalated:null,
    resolved:null,sla:0,loc:M?atDistance(M.geo,M.dist).ll:ROUTES[S.routeKey].pts[0]};
  if(M){M.sos=sos; M.recording=true; M.state='escorting'; M.paused=false;}
  S.activeSos=sos;
  $('#sosFrame').hidden=silent;
  clearLayer('sos');
  layers.sos=L.marker(sos.loc,{icon:L.divIcon({html:'<div class="ring"></div>',className:'',
    iconSize:[38,38],iconAnchor:[19,19]})}).addTo(map);
  note('red',silent?'Silent SOS active':'EMERGENCY SOS ACTIVE',
    'Operations centre alerted · 3 emergency contacts notified · protected recording started · high-rate location reporting on.');
  audit('subscriber','sos.raised',`${sos.id} · ${silent?'silent':'standard'} · ${sos.loc.map(n=>n.toFixed(5)).join(', ')}`);
  audit('system','notify.dispatch','SOC queue (audible) + 3 contacts via push/SMS/voice');
  if(!M)note('yellow','No drone airborne','Escalated on the non-aerial path. Nearest dock assessed for immediate launch.');
  render();
}
function sosAck(){
  const s=S.activeSos; if(!s||s.ack)return;
  s.ack=new Date();
  note('info','Operator acknowledged',`Operator K. Eze took the alert in ${s.sla}s. Live feed open in Command.`);
  audit('operator:K. Eze','sos.acknowledged',`${s.id} · ${s.sla}s`);
  render();
}
function sosEscalate(){
  const s=S.activeSos; if(!s||s.escalated)return;
  s.escalated=new Date();
  note('orange','Escalated to responders',
    'Scoped hand-off sent: location, live link, subject description. Nothing beyond the hand-off scope was shared.');
  audit('operator:K. Eze','sos.escalated',`${s.id} · responder: Rapid Response Lagos · legal basis: subscriber consent`);
  audit('operator:K. Eze','handoff.shared','scope=[location,live_link,subject_desc]');
  render();
}
function sosResolve(){
  const s=S.activeSos; if(!s)return;
  s.resolved=new Date();
  $('#sosFrame').hidden=true; clearLayer('sos');
  note('green','SOS resolved','Outcome recorded: subject safe, responders stood down. Evidence retained under incident hold.');
  audit('operator:K. Eze','sos.resolved',`${s.id} · outcome: subject safe`);
  S.activeSos=null;
  render();
}

/* ============================ SIM LOOP ============================ */
setInterval(()=>{
  $('#clock').textContent=hhmmss(new Date());
  const M=S.mission;
  const s=S.activeSos;
  if(s&&!s.ack)s.sla+=TICK/1000;

  if(M){
    const dt=TICK/1000*TIME_SCALE;
    M.t+=dt;

    if(M.state==='launching'){
      M.alt=Math.min(M.targetAlt,M.alt+M.targetAlt/8);
      M.battery-=0.05;
      if(M.alt>=M.targetAlt){
        M.state='escorting';
        note('green','Escort started',`${M.drone} airborne at ${Math.round(M.alt)} m, holding ${M.standoff} m stand-off ahead of the subject.`);
        audit('system','mission.escorting',M.id);
      }
    } else if(M.state==='escorting'&&!M.paused){
      const kmh=MODES[M.mode].kmh*(0.82+Math.random()*0.3);
      M.speed=kmh;
      M.dist+=kmh/3.6*dt;
      M.battery-=0.085;
      M.alt=M.targetAlt+Math.sin(M.t/14)*4;
    } else if(M.state==='paused'){
      M.speed=0; M.battery-=0.04;
    } else if(M.state==='returning'){
      M.dist=Math.max(0,M.dist-MODES[M.mode].kmh*1.5/3.6*dt);
      M.battery-=0.06; M.speed=MODES[M.mode].kmh*1.5;
      if(M.dist<=25){M.alt=Math.max(0,M.alt-M.targetAlt/8); if(M.alt<=0){endMission('landed');return}}
    }
    M.battery=Math.max(0,M.battery);
    M.peak=Math.max(M.peak,M.dist);   // journey distance covered, not current position

    /* --- battery reserve: hard, unprompted, overrides mission state --- */
    if(!M.reserveTripped&&M.battery<=RESERVE&&M.state!=='returning'){
      M.reserveTripped=true; M.state='returning';
      note('orange','Battery reserve reached — returning automatically',
        `${Math.round(M.battery)}% remaining. Energy-to-return floor enforced on the aircraft, not in the cloud. Mission state did not override it.`);
      audit('system','safety.reserve_return',`${M.id} · battery ${Math.round(M.battery)}%`);
    }
    if(M.battery<=LOW_WARN&&!M.fired.has('low')&&M.state!=='returning'){
      M.fired.add('low'); note('yellow','Battery below 30%','Return-to-dock recommended. Reserve floor at 22%.');
    }

    /* --- advisories along the route --- */
    const r=ROUTES[M.routeKey];
    r.advisories.forEach((a,i)=>{
      const trig=M.geo.total*a.at-500;
      if(M.dist>=trig&&!M.fired.has('adv'+i)&&M.state==='escorting'){
        M.fired.add('adv'+i);
        M.advisories.push(a);
        note(a.level,`${a.level.toUpperCase()} advisory · ${a.cat}`,
          `${a.desc} Source: ${a.source}, confidence ${a.conf}, ${a.confirmed?'human-confirmed':'UNCONFIRMED — operator review required'}.`);
        audit('system','advisory.raised',`${M.id} · ${a.level} · ${a.cat} · confirmed=${a.confirmed}`);
      }
    });

    /* --- arrival --- */
    if(M.state==='escorting'&&M.dist>=M.geo.total-30){
      note('green','Destination reached','Arrival notification sent to shared contacts.');
      M.state='returning'; audit('system','journey.arrived',M.id);
    }

    /* --- positions --- */
    const veh=atDistance(M.geo,M.dist);
    const dro=atDistance(M.geo,Math.min(M.geo.total,M.dist+M.standoff));
    if(layers.veh)layers.veh.setLatLng(veh.ll);
    if(layers.drone)layers.drone.setLatLng(dro.ll);
    if(layers.leash)layers.leash.setLatLngs([veh.ll,dro.ll]);
    if(layers.flown){
      const pts=layers.flown.getLatLngs();
      if(!pts.length||haversine([pts[pts.length-1].lat,pts[pts.length-1].lng],veh.ll)>12)
        layers.flown.addLatLng(veh.ll);
    }
    if(S.activeSos&&layers.sos)layers.sos.setLatLng(veh.ll);
    M.samples.push({t:M.t,ll:veh.ll,dll:dro.ll,bat:M.battery,alt:M.alt,spd:M.speed,state:M.state});
    if(M.state==='escorting'&&M.t%12<dt)map.panTo(veh.ll,{animate:true,duration:.6});
  }
  render();
},TICK);

/* ============================ VIDEO (synthetic feed) ============================ */
function paintVideo(cv,M){
  const ctx=cv.getContext('2d'),W=cv.width=cv.clientWidth*.75,H=cv.height=cv.clientHeight*.75;
  const t=M?M.t:0;
  ctx.fillStyle='#0d1424';ctx.fillRect(0,0,W,H);
  // ground gradient
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#15213a');g.addColorStop(1,'#0a1120');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  // road, scrolling
  ctx.save();ctx.translate(W/2,H*.55);
  ctx.fillStyle='#1d2740';
  ctx.beginPath();ctx.moveTo(-W*.14,-H*.55);ctx.lineTo(W*.14,-H*.55);
  ctx.lineTo(W*.46,H*.45);ctx.lineTo(-W*.46,H*.45);ctx.closePath();ctx.fill();
  // lane dashes
  ctx.strokeStyle='rgba(220,230,255,.3)';ctx.lineWidth=2;
  for(let i=0;i<9;i++){
    const o=((t*22)%46)+i*46-46, k=o/(H*.9);
    if(k<0||k>1)continue;
    ctx.globalAlpha=.1+k*.5;
    ctx.beginPath();ctx.moveTo(0,-H*.55+o*.9);ctx.lineTo(0,-H*.55+o*.9+14*(0.4+k));ctx.stroke();
  }
  ctx.globalAlpha=1;ctx.restore();
  // subject vehicle under the drone
  if(M&&M.state!=='launching'){
    ctx.fillStyle='#2ad4ff';ctx.globalAlpha=.9;
    const vy=H*.62, vw=W*.07,vh=vw*1.7;
    ctx.fillRect(W/2-vw/2,vy-vh/2,vw,vh);
    ctx.globalAlpha=1;
    ctx.strokeStyle='#2ad4ff';ctx.lineWidth=1.5;
    ctx.strokeRect(W/2-vw*.9,vy-vh*.85,vw*1.8,vh*1.7);
    ctx.font='9px ui-monospace,monospace';ctx.fillStyle='#2ad4ff';
    ctx.fillText('SUBJECT · LOCKED',W/2-vw*.9,vy-vh*.85-5);
  }
  // blurred bystanders — privacy minimisation, visibly applied
  for(let i=0;i<4;i++){
    const bx=W*(.12+i*.24)+Math.sin(t/6+i)*10, by=H*(.3+((t*8+i*70)%100)/100*.6);
    ctx.save();ctx.filter='blur(4px)';ctx.fillStyle='rgba(180,195,230,.5)';
    ctx.beginPath();ctx.arc(bx,by,5,0,7);ctx.fill();ctx.restore();
  }
  ctx.font='8px ui-monospace,monospace';ctx.fillStyle='rgba(143,163,200,.75)';
  ctx.fillText('bystanders auto-blurred (RC-7)',8,H-8);
}

/* ============================ RENDER ============================ */
/* Structural HTML is rebuilt only when the signature changes, so <select>
   dropdowns, the replay scrubber and text selection survive the 2 Hz tick.
   Volatile numbers are patched in place by tickDom(). */
function render(){
  const M=S.mission, s=S.activeSos;
  $('#rSub').setAttribute('aria-pressed',S.role==='sub');
  $('#rOps').setAttribute('aria-pressed',S.role==='ops');
  $('#main').className=S.role==='ops'?'operator':'';

  const sig=[S.role,S.routeKey,S.mode,S.droneId,
    M?`${M.id}|${M.state}|${M.paused}|${M.recording}|${M.advisories.length}`:'none',
    s?`${s.id}|${!!s.ack}|${!!s.escalated}`:'nosos',
    S.notes.length,S.audit.length,S.missions.length,S.replay?S.replay.id:'norep',
    preflight().filter(c=>!c.ok).length].join('~');

  if(sig!==S.sig){
    S.sig=sig;
    S.role==='sub'?renderSub(M,s):renderOps(M,s);
  }
  tickDom(M,s);
}

/* patch volatile values without touching structure */
function tickDom(M,s){
  const set=(id,v)=>{const n=document.getElementById(id);if(n&&n.textContent!==String(v))n.textContent=v};
  const bar=(id,pct)=>{const n=document.getElementById(id);if(n){n.style.width=pct+'%';
    n.style.background=pct<=RESERVE?'var(--red)':pct<=LOW_WARN?'var(--yellow)':'var(--green)'}};

  if(M){
    set('sAlt',Math.round(M.alt)); set('sSpd',Math.round(M.speed)); set('sElapsed',mmss(M.t));
    set('sBat',Math.round(M.battery)+'%'); set('sDist',(M.peak/1000).toFixed(2)+' km');
    bar('sBatBar',M.battery);
    set('hAlt',`ALT ${Math.round(M.alt)}m · ${Math.round(M.speed)}km/h`);
    set('mDist',(M.peak/1000).toFixed(2)+' km · '+Math.round(M.alt)+'m · '+
      Math.round(M.speed)+'km/h · bat '+Math.round(M.battery)+'%');
    bar('mBar',M.battery);
  }
  set('hClock',hhmmss(new Date()));
  if(s&&!s.resolved){
    set('sSla',s.ack?'ACK '+Math.round(s.sla)+'s':'waiting '+Math.round(s.sla)+'s');
    set('oSla',s.ack?'ACK':'UNACK '+Math.round(s.sla)+'s');
  }
  if(S.replay){
    const m=S.missions.find(x=>x.id===S.replay.id), sm=m&&m.samples[S.replay.i];
    if(sm){set('rT',mmss(sm.t));set('rState',sm.state);
      set('rAlt',Math.round(sm.alt)+'m · '+Math.round(sm.spd)+'km/h');
      set('rBat',Math.round(sm.bat)+'%');}
  }
  const cv=document.getElementById('cv'); if(cv&&M)paintVideo(cv,M);
}

/* ---------- shared fragments ---------- */
function stateP(M){
  if(!M)return '<span class="pill p-idle">Idle · docked</span>';
  const map={launching:'p-yellow',escorting:'p-green',paused:'p-yellow',returning:'p-yellow',degraded:'p-orange'};
  const lbl={launching:'Launching',escorting:'Escorting',paused:'Paused · holding',returning:'Returning to dock'};
  return `<span class="pill ${map[M.state]||'p-idle'}">${lbl[M.state]||M.state}</span>`;
}
function advLevel(M){
  if(!M||!M.advisories.length)return '<span class="pill p-green">Green · nothing reported</span>';
  const worst=['red','orange','yellow'].find(l=>M.advisories.some(a=>a.level===l))||'green';
  return `<span class="pill p-${worst}">${worst.charAt(0).toUpperCase()+worst.slice(1)} · ${M.advisories.length} advisory${M.advisories.length>1?'ies':''}</span>`;
}
function feedHtml(list,emptyMsg){
  if(!list.length)return `<div class="empty">${emptyMsg}</div>`;
  return list.map(n=>`<div class="item i-${n.level}"><b>${esc(n.title)}</b>
    <small>${hhmmss(n.ts)}</small><p>${esc(n.body)}</p></div>`).join('');
}

        <dt>Route length</dt><dd>${(buildPath(r.pts).total/1000).toFixed(2)} km</dd>
        <dt>Stand-off</dt><dd>${M?M.standoff+' m ahead':'—'}</dd>
        <dt>Reserve floor</dt><dd>${RESERVE}%</dd>
        <dt>RPIC</dt><dd>${M?esc(M.rpic):'—'}</dd>
      </dl>
    </div>

    <div class="card">
      <h3>Notifications</h3>
      <div class="feed">${feedHtml(S.notes,'No alerts. Launch an escort to begin.')}</div>
    </div>

    ${S.missions.length?`<div class="card">
      <h3>Mission records</h3>
      <div class="feed">${S.missions.map(m=>`
        <div class="item i-info"><b>${esc(m.id)} · ${(m.peak/1000).toFixed(2)} km</b>
        <small>${hhmmss(m.startedAt)} → ${m.endedAt?hhmmss(m.endedAt):'—'} · ${m.samples.length} samples</small>
        <p>${m.advisories.length} advisory event${m.advisories.length===1?'':'s'}${m.sos?' · SOS raised':''}${m.reserveTripped?' · reserve return':''}</p>
        <button class="btn-sm" data-replay="${esc(m.id)}" style="margin-top:7px">▶ Replay</button></div>`).join('')}</div>
      ${S.replay?replayUi():''}
    </div>`:''}`;

  if(M)paintVideo($('#cv'),M);
  wireSub();
}

function replayUi(){
  const m=S.missions.find(x=>x.id===S.replay.id); if(!m)return '';
  const i=S.replay.i, sm=m.samples[i]||m.samples[0];
  return `<div style="margin-top:11px;border-top:1px solid var(--line);padding-top:11px">
    <div class="row" style="justify-content:space-between;font-size:11.5px">
      <b>${esc(m.id)} replay</b><span class="meta" id="rT" style="font-family:var(--mono);color:var(--dim)">${mmss(sm.t)}</span></div>
    <input type="range" id="scrub" min="0" max="${m.samples.length-1}" value="${i}">
    <dl class="kv" style="margin-top:7px">
      <dt>State</dt><dd id="rState">${esc(sm.state)}</dd>
      <dt>Alt / speed</dt><dd id="rAlt">${Math.round(sm.alt)}m · ${Math.round(sm.spd)}km/h</dd>
      <dt>Battery</dt><dd id="rBat">${Math.round(sm.bat)}%</dd>
    </dl>
    <div class="note">Map, telemetry and (in production) video scrub together from the sealed record.</div>
    <button class="btn-sm" id="closeReplay" style="margin-top:8px">Close replay</button></div>`;
}

function wireSub(){
  const q=s=>document.getElementById(s);
  q('route')?.addEventListener('change',e=>{S.routeKey=e.target.value;drawRoute();render()});
  q('drone')?.addEventListener('change',e=>{S.droneId=e.target.value;render()});
  document.querySelectorAll('[data-mode]').forEach(b=>
    b.onclick=()=>{S.mode=b.dataset.mode;render()});
  q('bLaunch')&&(q('bLaunch').onclick=launch);
  q('bPause')&&(q('bPause').onclick=()=>command('pause'));
  q('bResume')&&(q('bResume').onclick=()=>command('resume'));
  q('bRtd')&&(q('bRtd').onclick=()=>command('rtd'));
  q('bAbort')&&(q('bAbort').onclick=()=>command('abort'));
  q('bSos')&&(q('bSos').onclick=()=>sosArm(false));
  q('bSilent')&&(q('bSilent').onclick=()=>sosArm(true));
  q('bResolve')&&(q('bResolve').onclick=sosResolve);
  document.querySelectorAll('[data-replay]').forEach(b=>b.onclick=()=>{
    S.replay={id:b.dataset.replay,i:0}; showReplay(); render();
  });
  q('scrub')&&(q('scrub').oninput=e=>{S.replay.i=+e.target.value;showReplay();render()});
  q('closeReplay')&&(q('closeReplay').onclick=()=>{S.replay=null;clearLayer('ghost');render()});
}

function showReplay(){
  const m=S.missions.find(x=>x.id===S.replay.id); if(!m)return;
  const sm=m.samples[S.replay.i]; if(!sm)return;
  clearLayer('ghost');
  layers.ghost=L.marker(sm.ll,{icon:icon('✛','mk-drone',20)}).addTo(map);
  map.panTo(sm.ll,{animate:true,duration:.3});
}

/* ---------- operator / SOC ---------- */
function renderOps(M,s){
  const L=$('#colLeft'), R=$('#colRight');
  const live=M?[M]:[];

  L.innerHTML=`
    <div class="card">
      <h3>SOS triage queue</h3>
      ${s?`<div class="mission sos">
          <div class="top"><span class="nm">${esc(s.id)}</span>
            <span class="sla" id="oSla">${s.resolved?'RESOLVED':s.ack?'ACK':'UNACK'}</span></div>
          <div class="meta">${esc(M?M.id:'no mission')} · ${s.silent?'SILENT':'standard'} · ${s.loc.map(n=>n.toFixed(4)).join(', ')}</div>
          <div class="meta" style="margin-top:4px">raised ${hhmmss(s.at)}${s.ack?' · ack '+hhmmss(s.ack):''}${s.escalated?' · escalated '+hhmmss(s.escalated):''}</div>
          <div class="btn-row">
            <button class="btn-sm" id="oAck" ${s.ack?'disabled':''}>${s.ack?'✓ Acknowledged':'Acknowledge'}</button>
            <button class="btn-sm" id="oEsc" ${!s.ack||s.escalated?'disabled':''}>${s.escalated?'✓ Escalated':'Escalate'}</button>
          </div>
          <div class="btn-row"><button class="btn-sm" id="oRes" ${!s.ack?'disabled':''} style="grid-column:span 2">Resolve</button></div>
          ${!s.ack&&s.sla>25?`<div class="note" style="color:var(--orange)">Auto-escalation to tier 2 at 30s (FR-7.6).</div>`:''}
        </div>`
       :`<div class="empty">Queue clear. No open alerts.</div>`}
    </div>

    <div class="card">
      <h3>Active missions · ${live.length}</h3>
      ${live.length?live.map(m=>`
        <div class="mission ${S.selMission===m.id?'sel':''} ${m.sos&&!m.sos.resolved?'sos':''}">
          <div class="top"><span class="nm">${esc(m.id)}</span>${stateP(m)}</div>
          <div class="meta">${esc(m.drone)} · RPIC ${esc(m.rpic)} · ${esc(ROUTES[m.routeKey].label)}</div>
          <div class="meta" id="mDist" style="margin-top:4px">${(m.peak/1000).toFixed(2)} km</div>
          <div class="bar"><i id="mBar" style="width:${m.battery}%;background:${m.battery<=RESERVE?'var(--red)':m.battery<=LOW_WARN?'var(--yellow)':'var(--green)'}"></i></div>
        </div>`).join('')
       :`<div class="empty">No missions airborne. Switch to the Subscriber view to launch one.</div>`}
    </div>

    <div class="card">
      <h3>Fleet health</h3>
      ${DRONES.map(d=>`<div class="mission" style="cursor:default;margin-bottom:7px">
        <div class="top"><span class="nm">${esc(d.id)}</span>
          <span class="pill ${d.air==='ok'?(M&&M.drone===d.id?'p-green':'p-idle'):'p-orange'}">${
            d.air==='ok'?(M&&M.drone===d.id?'Airborne':'Docked'):'Maintenance'}</span></div>
        <div class="meta">${esc(d.model)} · fw ${esc(d.fw)} · ${d.cycles} cycles</div>
        <div class="meta" style="margin-top:3px">${esc(d.dock)}</div>
        <div class="bar"><i style="width:${M&&M.drone===d.id?M.battery:d.battery}%;background:var(--green)"></i></div>
      </div>`).join('')}
    </div>`;

  R.innerHTML=`
    <div class="card">
      <h3>Subject feed</h3>
      <div class="video"><canvas id="cv"></canvas>
        ${M?`<div class="hud"><div class="row" style="justify-content:space-between">
            <span>${esc(M.id)} · ${esc(M.drone)}</span>
            <span class="tr">${M.recording?'<span class="rec">REC</span>':'MONITOR'}</span></div>
          <div class="row" style="justify-content:space-between">
            <span>operator: K. Eze</span><span id="hClock"></span></div></div>`
         :`<div class="off">NO ACTIVE FEED</div>`}
      </div>
      <div class="note">Stream access is logged: who watched, when (FR-6.4).</div>
    </div>

    <div class="card">
      <h3>Advisories</h3>
      <div class="feed">${M&&M.advisories.length?M.advisories.map(a=>`
        <div class="item i-${a.level}"><b>${esc(a.cat)}</b><small>${esc(a.source)}</small>
        <p>${esc(a.desc)}</p>
        <div class="prov"><span>conf: ${esc(a.conf)}</span>
          <span class="${a.confirmed?'':'unconf'}">${a.confirmed?'human-confirmed':'UNCONFIRMED'}</span></div></div>`).join('')
        :'<div class="empty">No advisories on the active route.</div>'}</div>
      <div class="note">Unconfirmed machine observations are visually distinct and never auto-classify a person (RC-5).</div>
    </div>

    <div class="card">
      <h3>Audit log · append-only</h3>
      <div class="audit">${S.audit.length?S.audit.map(a=>
        `<div><b>${esc(a.actor)}</b> ${esc(a.action)}<br>${hhmmss(a.ts)} · ${esc(a.detail)}</div>`).join('')
        :'<div class="empty">No events yet.</div>'}</div>
    </div>`;

  if(M)paintVideo($('#cv'),M);
  const q=s=>document.getElementById(s);
  q('oAck')&&(q('oAck').onclick=sosAck);
  q('oEsc')&&(q('oEsc').onclick=sosEscalate);
  q('oRes')&&(q('oRes').onclick=sosResolve);
}

/* ---------- wiring ---------- */
$('#rSub').onclick=()=>{S.role='sub';render()};
$('#rOps').onclick=()=>{S.role='ops';render()};
$('#sosCancel').onclick=sosAbort;
$('#sosNow').onclick=()=>sosFire(false);
window.addEventListener('resize',()=>{map.invalidateSize();render()});

note('info','Welcome to the Drone Escorts prototype',
  'Flight dynamics are simulated; mission logic, pre-flight gating, battery-reserve enforcement, SOS escalation and the audit trail are real. Pick a route and press Launch Escort.');
render();
</script>
</body>
</html>
